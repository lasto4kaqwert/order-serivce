services:
  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - order_service_postgres18_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE_NAME}
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  order_service_postgres18_data: